<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <title>{% block title %}{% endblock %}</title>
            
		<!-- Stylesheets -->
		<link rel="stylesheet" href="/admin/static/css/style.css">
        {% block stylesheet %}
        {% endblock %}
	</head>
	<body>
        <header class="header">
            <table width="100%">
                <tr>
                    <td style="text-align: left; padding-left: 20px;"><a class="nav-button" style="font-size: 16px" href="{{ url_for("index.root_index") }}">Home</a></td>
                    <td style="text-align: center">Admin panel</td>
                    <td style="text-align: right; padding-right: 20px;"><a class="nav-button" style="font-size: 16px" href="{{ url_for("index.logout") }}">Logout</a></td>
                </tr>
            </table>
        </header>
        <main class="admin-panel">
            <div class="nav-panel">
                <ul style="padding-left: 20px;list-style:none">
                    <li><a class="nav-button" href="{{ url_for("admin_posts.posts") }}">Posts</a></li>
                    <li><a class="nav-button" href="{{ url_for("admin_settings.settings") }}">Settings</a></li>
                    <li><a class="nav-button" href="{{ url_for("admin_users.users") }}">Users</a></li>
                </ul>
            </div>
            <div class="work-area">
                <section style="width:90%">
                {% block content %}
                {% endblock %}
                </section>
            </div>
        </main>
	</body>
</html>
